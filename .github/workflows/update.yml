name: Update Pococha Border Data

on:
  schedule:
    # JST 11:00 / 18:00 / 20:00 / 翌02:00 に実行（複数回チェック）
    - cron: '0 2 * * *'   # 11:00 JST
    - cron: '0 9 * * *'   # 18:00 JST
    - cron: '0 11 * * *'  # 20:00 JST
    - cron: '0 17 * * *'  # 翌 02:00 JST (24時締め確定用)
  workflow_dispatch:  # 手動実行を許可

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-jpn

      - name: Run scraper (daily HTML)
        run: python3 scraper.py

      - name: Run OCR backfill (chart images)
        env:
          OCR_DEBUG: ${{ vars.OCR_DEBUG }}
          OCR_LIMIT: ${{ vars.OCR_LIMIT }}
        run: python3 ocr_backfill.py
        continue-on-error: true

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain data.json)" ]]; then
            git add data.json
            git commit -m "chore: update border data ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          else
            echo "No changes."
          fi
